spring.application.name=campus-lost-found

# ---- Load settings from the .env file (in the backend folder) ----
# "optional:" = no error if the file is missing, but then the variables below
# must come from real environment variables. Values from .env are read as
# properties; real OS environment variables take priority over .env.
spring.config.import=optional:file:.env[.properties]

# ---- PostgreSQL connection ----
# No defaults on purpose: nothing is hardcoded. Define these in .env.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---- Security / JWT ----
# JWT_SECRET: at least 32 random characters, only in .env. Generate one with:
#   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# ---- Google sign-in (optional): OAuth client ID from Google Cloud Console. Empty = disabled ----
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ---- First admin account (created at startup if the email is set and unused) ----
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Frontend origins allowed to call this API (comma separated) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ---- Image uploads: pictures are stored on this server's disk (never in the database) ----
# UPLOAD_DIR: folder for the pictures (relative to where you run Maven). It is git-ignored.
app.upload.dir=${UPLOAD_DIR:uploads}
# Nightly cleanup: unused uploads older than this many hours are deleted
app.upload.orphan-max-age-hours=${UPLOAD_ORPHAN_MAX_AGE_HOURS:24}
# Pictures of RETURNED/CLOSED reports older than this many days are deleted (0 = keep forever)
app.upload.retention-days=${UPLOAD_RETENTION_DAYS:30}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- JPA / Hibernate ----
# "update" creates missing tables/columns from the entity classes at startup.
# Fine for learning; it never drops data but cannot handle renames or complex
# changes, so real projects use migration tools (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080
