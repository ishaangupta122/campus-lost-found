spring.application.name=campus-lost-found

# Settings come from backend/.env (real environment variables override it)
spring.config.import=optional:file:.env[.properties]

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JWT signing secret
app.jwt.secret=${JWT_SECRET}

# Google sign-in (empty = disabled)
app.google.client-id=${GOOGLE_CLIENT_ID:}

# First admin, created at startup if the email is set and unused
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Frontend origins allowed to call the API (comma separated)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Image uploads (stored on disk)
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB

# JPA: "update" creates missing tables and columns from the entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
